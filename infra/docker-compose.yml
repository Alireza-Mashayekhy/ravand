# ════════════════════════════════════════════════════════════════════
#  Ravand — استک محلی
#
#  پیش‌فرض (فقط دیتابیس):
#     pnpm db:up        →  docker compose -f infra/docker-compose.yml up -d
#
#  کل استک (mysql + api + web):
#     pnpm stack:up     →  docker compose -f infra/docker-compose.yml --profile full up -d --build
#
#  سرویس‌های api و web داخل پروفایل «full» هستند تا dev لوکال فقط به
#  یک دیتابیس نیاز داشته باشد و مجبور نباشی هر بار کل استک را build کنی.
# ════════════════════════════════════════════════════════════════════

name: ravand

services:
  mysql:
    image: mysql:8.4
    container_name: ravand-mysql
    restart: unless-stopped

    # یکسان‌سازی charset و timezone با تنظیمات TypeORM (timezone: 'Z')
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00

    environment:
      MYSQL_DATABASE: ravand
      MYSQL_USER: ravand
      # برای دموی محلی؛ در استقرار واقعی از secret manager استفاده کن
      MYSQL_PASSWORD: ravand_dev_password
      MYSQL_ROOT_PASSWORD: ravand_root_password

    ports:
      # پورت میزبان 3307 است تا با MySQL نصب‌شدهٔ روی سیستم تضاد نداشته باشد
      - '3307:3306'

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    profiles: ['full']
    build:
      context: ..
      dockerfile: infra/docker/api/Dockerfile

    container_name: ravand-api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      API_PORT: 3001
      CORS_ORIGINS: http://localhost:3333
      # مایگریشن‌ها هنگام بالا آمدن اجرا می‌شوند (در dev دستی اجرا می‌کنیم)
      RUN_MIGRATIONS: 'true'

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ravand
      DB_USER: ravand
      DB_PASSWORD: ravand_dev_password

    ports:
      - '4444:3001'

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3001/api/v1/health > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    profiles: ['full']
    build:
      context: ..
      dockerfile: infra/docker/web/Dockerfile
      args:
        # API_URL در زمان build داخل rewrite پروکسی Next نوشته می‌شود،
        # پس باید دقیقاً همان مقدار runtime باشد.
        API_URL: http://api:3001

    container_name: ravand-web
    restart: unless-stopped

    environment:
      NODE_ENV: production
      # SSR و rewrite از داخل شبکهٔ داکر به سرویس api وصل می‌شوند
      API_URL: http://api:3001

    ports:
      - '3333:3000'

    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
