services:
  mysql:
    image: mysql:8.4
    container_name: ravand-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ravand
      MYSQL_USER: ravand
      MYSQL_PASSWORD: ravand_dev_password
      MYSQL_ROOT_PASSWORD: ravand_root_password

    ports:
      - '3307:3306'

    volumes:
      - ravand_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: infra/docker/api/Dockerfile

    container_name: ravand-api
    restart: unless-stopped

    environment:
      NODE_ENV: production

      API_PORT: 3001
      WEB_URL: http://localhost:3333

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ravand
      DB_USER: ravand
      DB_PASSWORD: ravand_dev_password

    ports:
      - '4444:3001'

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3001/api/v1/health > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4444/api/v1

    container_name: ravand-web
    restart: unless-stopped

    environment:
      NODE_ENV: production

    ports:
      - '3333:3000'

    depends_on:
      api:
        condition: service_healthy

volumes:
  ravand_mysql_data:
