packages:
  - 'apps/*'
  - 'packages/*'

# نسخه‌های مشترک: هر پکیجی که این ابزارها را لازم دارد از «catalog:» استفاده می‌کند
# تا هیچ‌وقت دو نسخهٔ متفاوت در یک ریپو نداشته باشیم.
#
# ⚠️ eslint روی ۹ قفل است (نه ۱۰): `eslint-config-next` از eslint-plugin-react
# استفاده می‌کند که با ESLint 10 سازگار نیست و lint وب با خطای
# «contextOrFilename.getFilename is not a function» می‌شکند.
# همچنین @eslint/js باید هم‌نسخهٔ eslint باشد (وگرنه peer warning می‌دهد).
catalog:
  '@eslint/js': ^9.39.5
  '@types/node': ^22.18.0
  eslint: ^9.39.5
  eslint-config-prettier: ^10.1.8
  eslint-plugin-simple-import-sort: ^14.0.0
  eslint-plugin-unused-imports: ^4.4.1
  prettier: ^3.9.9
  typescript: ^6.0.2
  typescript-eslint: ^8.71.0
